<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل طوارئ السويداء</title>
    
    <!-- SEO & Social -->
    <meta property="og:title" content="دليل طوارئ السويداء">
    <meta property="og:description" content="أرقام الطوارئ والمشافي في مكان واحد">
    <meta property="og:image" content="./icon-512.png">
    <meta property="og:url" content="./">
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Styles -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>دليل طوارئ السويداء</h1>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="ابحث... (مثال: إطفاء، مشفى)">
    </div>

    <div class="container">
        <!-- Emergency Section -->
        <h2 class="section-title">الطوارئ العاجلة</h2>
        <div id="emergencyGrid" class="grid"></div>

        <!-- Map Section -->
        <h2 class="section-title">خريطة المراكز الطبية</h2>
        <div class="map-container">
            <div id="map" class="map-frame"></div>
            <p class="map-note">
                * الخريطة تحتاج اتصال بالإنترنت لتحميلها لأول مرة.
            </p>
        </div>

        <!-- Hospitals Phone List (Added so they are searchable) -->
        <h2 class="section-title">أرقام المشافي</h2>
        <div id="hospitalGrid" class="grid"></div>

        <!-- Feedback Form -->
        <h2 class="section-title">أضف رقم أو صحح معلومة</h2>
        <div class="feedback-form">
            <form action="https://formspree.io/f/xlgwllgb" method="POST">
                <div class="form-group">
                    <label>الاسم (اختياري)</label>
                    <input type="text" name="name" class="form-input">
                </div>
                <div class="form-group">
                    <label>الاقتراح أو التصحيح</label>
                    <textarea name="message" rows="3" class="form-input" required></textarea>
                </div>
                <button type="submit" class="submit-btn">إرسال</button>
            </form>
        </div>
    </div>

    <!-- PWA Install Banner -->
    <div id="installBanner">
        <span>قم بتحميل التطبيق للوصول السريع بدون انترنت</span>
        <div>
            <button id="btnInstall">تحميل</button>
            <button id="btnCloseBanner" class="btn-outline">إغلاق</button>
        </div>
    </div>

    <!-- Floating Share Button -->
    <a id="shareBtn" class="share-float" href="#" role="button" aria-label="Share">
        <i class="fab fa-whatsapp"></i>
    </a>

    <footer>
        <p>دليل السويداء للطوارئ | 2026</p>
        <p class="credits">
            Made with <i class="fas fa-heart"></i> by
            <a href="https://tammam-alhadwah.github.io" target="_blank">Tammam Alhadwah</a>
        </p>
    </footer>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
